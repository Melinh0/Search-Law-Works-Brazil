title: "Trabalho no Brasil 2026: Legislação, Modalidades e Tendências"
subtitle: "Relações de trabalho, CLT, PJ, MEI e trabalho informal"
genre: "Relatório"
author: "Yago Melo da Costa"
institution: ""
place: "Fortaleza, Ceará"
lang: pt-BR

defaults:
  min_words: 450
  max_words: 900
  charts: 1
  chart_rules: >
    TODO grafico deve trazer o campo 'nota' com UMA frase de interpretacao
    (tendencia, comparacao ou regra). PROIBIDO grafico com apenas UM valor ou
    UMA categoria - nesse caso use comparativo ou tabela (para etapas e
    sequencias use tabela Markdown com passos numerados; NAO use diagramas
    de fluxo). Graficos de
    linha de series temporais devem usar a serie historica LONGA completa
    (medias anuais 2012-2026), nunca um recorte curto de anos recentes. Nos
    itens de comparativo e nas tabelas, escreva numeros formatados em portugues com
    unidade ('1,2 milhao', '102,5 milhoes', 'R$ 3.777,50'); NUNCA numeros crus
    como '1200000'. NAO repita series que ja foram graficadas em outra secao:
    taxa de desocupacao, pessoas ocupadas, rendimento medio mensal real e
    taxa de informalidade pertencem a secao 1 e NUNCA devem aparecer de novo
    em outra secao - nem como serie completa, nem como recorte reduzido,
    resumo em barras ou 'panorama' (se precisar retomar um numero, cite-o em
    texto ou tabela, sem grafico novo).
    Quando a serie tiver apenas poucos anos (ex.: PNS 2013 e 2019) ou anos sem
    dado, use nos graficos APENAS os anos existentes no contexto e explique NO
    TEXTO a cobertura (periodicidade da pesquisa, edicoes disponiveis, coleta em
    andamento); NUNCA invente valores ou anos intermediarios.
    Quando graficar salario minimo ou rendimento medio, traga pelo menos um
    grafico com os valores EM REAIS (R$) do contexto; se usar indice
    (ex.: 2012=100), explique a base na 'unidade' e na 'nota' do grafico. Sempre
    que houver inflacao (IPCA) no contexto, faca tambem a leitura de poder de
    compra desses valores, em texto ou grafico proprio - NAO misture reais e
    indice no mesmo grafico.

sections:
  - id: panorama
    number: 1
    title: "Panorama do trabalho no Brasil em 2026"
    charts: 14
    words: [1500, 1900]
    must_include: [ibge-pnad, ibge-pns, ipea-series-mercado, senado-sm-2026-orcamento, senado-arcabouco-2023, dieese-salario-minimo-necessario, dieese-cesta-basica-set-2026]
    extra_queries:
      - "salário mínimo 2026 valor R$ 1.621 reajuste"
      - "arcabouço fiscal limite salário mínimo 0,6% 2,5%"
      - "volume de informais taxa de informalidade Brasil"
      - "poder de compra rendimento médio inflação IPCA"
      - "salário mínimo necessário Dieese família quatro pessoas"
      - "cesta básica nacional custo setembro 2026 Dieese"
      - "salário mínimo nominal e necessário série histórica Dieese"
      - "rendimento médio homens mulheres diferença PNAD"
      - "força de trabalho participação feminina masculina por sexo"
      - "taxa de desocupação por região Norte Nordeste Sudeste Sul Centro-Oeste"
      - "informalidade por região Brasil PNAD"
      - "rendimento médio por região Norte Nordeste Sudeste Sul"
    brief: >
      Quadro geral do mercado de trabalho brasileiro em 2026. Use OBRIGATORIAMENTE
      as series reais do IBGE/PNAD Continua presentes no contexto (taxa de
      desocupacao, pessoas ocupadas, rendimento medio mensal real), que cobrem de
      2012 a 2026. Construa NO MINIMO DOIS graficos de linha com a SERIE HISTORICA
      LONGA de 2012 a 2026 (use as medias anuais do contexto) - NAO use apenas
      2025-2026. Cada grafico deve exibir todos os anos de 2012 ate 2026 no eixo X,
      de forma que o leitor possa analisar a trajetoria completa. Complemente com a
      taxa de informalidade e o volume de informais divulgados pela imprensa (cite a
      fonte de cada numero). Explique o tamanho e a importancia de cada segmento
      (carteira assinada, autonomos, MEI, informal) e compare o patamar de 2026 com
      anos anteriores (pico de 2020, queda ate 2026). Inclua tambem a saude
      autoavaliada da Pesquisa Nacional de Saude (PNS): percentual de saude
      boa ou muito boa em 2013 e 2019 por situacao ocupacional (ocupada,
      desocupada, fora da forca de trabalho), com um grafico comparando os
      dois anos, e citando tambem as diferencas por faixa de renda e cor ou
      raca quando presentes no contexto.
      SOBRE A COBERTURA DA PNS (obrigatorio): explique no texto que a PNS e
      uma pesquisa quinquenal, com edicoes de 2013 e 2019, e que a 3a edicao
      (PNS 2026) esta em coleta em 2026; por isso a serie de saude tem apenas
      esses dois anos - use nos graficos somente 2013 e 2019 e NAO invente
      anos intermediarios.
      POLITICA DE SALARIO MINIMO E ARCADOUCO FISCAL (obrigatorio): monte a
      trajetoria de valores do salario minimo presentes no contexto (anos
      disponiveis, ex.: 2019, 2022, 2025 e 2026) e explique as regras em
      vigor: Lei 14.663/2023 (INPC mais crescimento do PIB), LC 200/2023 e a
      EC 126/2022 (novo regime fiscal e teto de gastos). Cite que o salario
      minimo de 2026 e de R$ 1.621 e que, sem o limite do arcabouco fiscal,
       o aumento teria sido R$ 10 maior (Senado). A serie mensal COMPLETA de
       salario minimo nominal (1994-2026) e a serie do salario minimo
       NECESSARIO do DIEESE estao na fonte dieese-salario-minimo-necessario:
       monte as series ANUAIS usando dezembro de cada ano (2012-2026) e, para
       2026, o mes mais recente da serie (setembro); NAO invente valores
       fora do contexto. FACa UM
      GRAFICO EM REAIS (R$) comparando salario minimo real e rendimento medio
      mensal real com e sem carteira (series Ipea do contexto, todas em R$);
      NAO misture reais e indice no mesmo grafico e NAO transforme em indice
      2012=100 sem explicar a base na unidade e na nota.
      PODER DE COMPRA (obrigatorio): nesse mesmo periodo, compare o
      crescimento do rendimento medio e do salario minimo com a inflacao
       (IPCA) presente no contexto e explique o que isso significa para o poder
       de compra do trabalhador ate 2026.
       SALARIO MINIMO E SALARIO MEDIO x CUSTO DE VIDA (obrigatorio): responda
       a pergunta CENTRAL desta secao - o salario minimo e o salario medio do
       brasileiro bastam para cobrir os elementos basicos da vida? Monte a
       resposta em SERIE TEMPORAL (2012-2026) com DOIS graficos de linha em
       R$ nominais: (1) salario minimo nominal (fonte DIEESE) versus salario
       minimo NECESSARIO do DIEESE no mesmo periodo; (2) rendimento medio
       mensal nominal (PNAD, do contexto) versus o salario minimo NECESSARIO.
       Explique a metodologia do salario minimo necessario do DIEESE com a
       fonte dieese-metodologia-smn: custo da cesta basica de maior valor
       entre as capitais, multiplicado por 3 (familia de quatro pessoas) e
       dividido pela participacao orçamentaria da alimentacao de 35,71%
       (Pesquisa de Orcamento Familiar); a cesta constitucional supre
       alimentacao, moradia, saude, educacao, vestuario, higiene, transporte,
       LAZER e previdencia (CF art. 7o, IV) - destaque que o LAZER faz parte
       desse calculo. Use os valores atuais presentes no contexto: salario
       minimo de R$ 1.621,00 em 2026 e salario minimo necessario de
       R$ 7.750,01 em setembro de 2026 (4,78 vezes o minimo pago), e
       conclua explicitamente qual seria o salario que satisfaria a cesta
       constitucional (o necessario DIEESE) e quanto falta para o salario
        minimo e para o rendimento medio alcancar esse patamar. Inclua tambem
        o dado de custo da cesta basica de alimentos da fonte
        dieese-cesta-basica-set-2026: valor da cesta mais cara no mes mais
        recente, o PERCENTUAL do salario minimo apontado pela propria fonte e
        as HORAS de trabalho necessarias para compra-la - esses tres dados
        constam da fonte e devem aparecer COM OS NUMEROS: em Sao Paulo a cesta
        custou R$ 922,51 e o trabalhador do salario minimo precisou de
        125 horas e 12 minutos de trabalho (ou 61,52% da renda liquida apos o
        desconto de 7,5% da Previdencia); NAO use frases qualitativas como
        'diversas horas' no lugar desses numeros. Feche a analise com CONCLUSAO
        NUMERICA explicita: quanto falta em R$ para o salario minimo de
        R$ 1.621,00 e para o rendimento medio nominal atual alcancarem o
        salario minimo necessario de R$ 7.750,01, e que salario efetivamente
        satisfaria a cesta constitucional (o necessario DIEESE).
        GENERO - POPULACAO QUE TRABALHA E QUANTO RECEBE (obrigatorio): analise
        as series Ipea por sexo do contexto (PNADCT_PCT14UF_HOM/MUL,
        PNADCT_PCTDFTUF_HOM/MUL, PNADCT_RRHPUF_HOM/MUL). Explique que as
        mulheres sao aproximadamente metade da populacao de 14 anos ou mais,
        mas minoria na forca de trabalho (aponte os percentuais atuais de cada
        sexo presentes no contexto), compare o rendimento medio real mensal de
        homens e mulheres em 2026 e no inicio da serie (2012), calcule a
        diferenca em R$ e em % e comente a evolucao do gap ao longo dos anos
        (os valores mensais recentes tambem estao no contexto). Gere DOIS
        graficos novos com essas series: composicao por sexo e rendimento por
        sexo - NAO misture essas series com as ja graficadas de desocupacao e
        informalidade nacionais.
        REGIOES DO PAIS (obrigatorio): compare as CINCO Grandes Regioes com as
        series Ipea por regiao do contexto (desocupacao PNADCT_TXDSCUPUF,
        informalidade PNADCT_TXINFORMUF e rendimento PNADCT_RRHPUF, todas com
        Norte, Nordeste, Sudeste, Sul e Centro-Oeste). Em TEXTO, identifique
        quem lidera e quem fecha em cada indicador, a distancia entre os
        extremos (ex.: maior x menor taxa, Sudeste x Nordeste em rendimento) e
        o que essas diferencas revelam sobre a desigualdade regional do
        trabalho - use OS NUMEROS do contexto, nao qualificativos vagos.
        Tambem comente se a hierarquia regional se mantem estavel ao longo da
        serie 2012-2026 ou se ha mudancas de posicao.
        GRAFICOS OBRIGATORIOS DESTA SECAO (todos devem constar; cada serie em
        UM UNICO grafico): (1) taxa de desocupacao em linha 2012-2026;
        (2) pessoas ocupadas em linha 2012-2026; (3) rendimento medio mensal
        real em linha 2012-2026; (4) taxa de informalidade; (5) saude
        autoavaliada boa ou muito boa 2013 vs 2019 por situacao ocupacional;
        (6) saude autoavaliada por cor ou raca ou faixa de renda;
        (7) salario minimo real vs rendimento medio real em R$ com e sem
        carteira; (8) salario minimo NOMINAL vs NECESSARIO do DIEESE em serie
        2012-2026; (9) rendimento medio NOMINAL vs salario NECESSARIO do
        DIEESE em serie 2012-2026; (10) composicao por sexo da populacao de
        14 anos ou mais e da forca de trabalho (barra empilhada, ano mais
        recente); (11) rendimento medio real mensal de homens e mulheres em
        linha 2012-2026 (R$); (12) taxa de desocupacao das CINCO regioes em
        linha 2012-2026; (13) taxa de informalidade das CINCO regioes em
        linha 2012-2026; (14) rendimento medio real das CINCO regioes em
        linha 2012-2026 (R$). NAO crie outros graficos nem repita series ja
        graficadas.

  - id: principios-constitucionais
    number: 2
    title: "Princípios constitucionais do trabalho"
    charts: 2
    must_include: [constituicao-trabalho, clt]
    brief: >
      Direitos sociais do trabalhador (CF art. 7o), liberdade sindical e
      greve (CF art. 8o e 11), funcao social da propriedade, protecao ao
      trabalho humano. Principio da protecao, da condicao mais benéfica e
      da norma mais favoravel ao trabalhador. Explique com base textual da
      Constituicao e da CLT presentes no contexto, sempre citando o artigo.
      Inclua um diagrama (bloco comparativo) dos principais direitos do art. 7o.

  - id: clt
    number: 3
    title: "CLT: estrutura, história e direitos essenciais"
    charts: 2
    must_include: [clt, constituicao-trabalho, reforma-2017]
    extra_queries:
      - "terceirização reforma trabalhista 2017 regras"
      - "dispensa por acordo artigo 484-A multa 40%"
      - "negociação sobre a lei 611-A 611-B CLT"
    brief: >
      Historico (Decreto-Lei 5.452/1943), estrutura da consolidacao, principios
      que a regem. Direitos essenciais: contrato de trabalho, jornada (8h,
      44h semanais, horas extras e adicional de 50%), intervalos, faltas,
      feriados, ferias + 1/3, 13o salario, aviso previo, rescisao e verbas
      rescisorias, FGTS, adicional noturno, periculosidade e insalubridade,
      salario minimo. Reforma trabalhista de 2017 (Lei 13.467/2017) EM
      DETALHE, com o que mudou na pratica em cada ponto: negociacao sobre a
      lei (CLT arts. 611-A e 611-B), ampliacao da terceirizacao (regras
      vigantes citadas nas fontes do contexto), trabalho intermitente (art. 452-A),
      teletrabalho (arts. 75-A a 75-F), banco de horas e acordo de
      compensacao firmados no plano individual, dispensa por acordo com multa
      de 40% (art. 484-A), intervalo intrajornada, horas extras e regras de
      justa causa. Explique TAMBEM por que essa reforma e apontada como fator
      de crescimento de PJ, MEI e trabalho informal (custo e complexidade do
      vinculo em comparacao a um DAS de MEI de valor fechado), citando as
      fontes do contexto e conectando a analise com as secoes de modalidades.
      EC 103/2019 e regras previdenciarias aplicadas ao trabalhador.
      Como o Estado aplica a CLT: papel da Auditoria-Fiscal do Trabalho.
      JORNADA: explique com base legal a jornada normal de 8h diarias e 44h
      semanais E TAMBEM a regra da jornada EXCEPCIONAL: quando e como o
      trabalhador pode ultrapassar 8h diarias (horas extras previso no art.
      59 da CLT), o adicional de 50%, o limite legal de 10h diarias, o
      intervalo intrajornada obrigatorio e as consequencias do descumprimento.
      NAO represente '8h por dia' e '44h por semana' no mesmo grafico de
      barras (unidades/escalas diferentes) - use texto, tabela ou graficos
      separados para cada um.
      Use graficos para comparar regras (ex.: jornada e adicional de horas
      extras; antes e depois da reforma de 2017).

  - id: vinculo
    number: 4
    title: "Vínculo de emprego: os 4 requisitos e a subordinação algorítmica"
    charts: 0
    must_include: [clt, codigo-civil, lc123-mei, stf-pejotizacao-2026]
    brief: >
      Pessoa fisica, habitualidade, onerosidade, pessoalidade e subordinacao.
      Como a jurisprudencia (TST, STF) analisa cada requisito. Subordinacao
      algoritmica no trabalho por aplicativo. Presuncao de vinculo e
      responsabilidade solidaria. Distincao entre emprego, trabalho autônomo
      e cooperado (CC art. 593 e CLT arts. 3o, 442-B e 603). Pejotizacao: o que
      e, por que e considerada abusiva, consequencias para empresa e trabalhador
      (pagamento retroativo, multas, responsabilidade em casos de fraude).
      Use uma tabela Markdown com os requisitos do vinculo empregaticio
      (passo, requisito e base legal).

  - id: modalidades-vinculo
    number: 5
    title: "Modalidades de trabalho com vínculo empregatício"
    structure:
      - "Faca um subcabecalho (###) para CADA modalidade listada no briefing."
      - "Em cada subcabecalho, use sempre estes cinco pontos, com paragrafos separados:"
      - "1) Como funciona na pratica: quem contrata, como e o contrato, jornada, pagamento, duracao."
      - "2) Como deveria funcionar segundo a lei: base legal exata (lei e artigo), direitos obrigatorios e limites."
      - "3) Direitos e deveres: crie uma tabela com duas colunas ('Direitos do trabalhador' e 'Deveres (trabalhador e contratante)'), com a base legal de cada item; depois liste em texto os deveres do contratante."
      - "4) Como o Estado enxerga e age: cite obrigatoriamente a fiscalizacao da Secretaria de Inspecao do Trabalho/MTE (Auditoria-Fiscal do Trabalho, cujos poderes estao na Lei 10.593/2002), o registro do contrato em CTPS digital e eSocial, a apuracao por denuncia ou acao fiscal, e as sancoes administrativas previstas no Livro V da CLT (autos de infracao e multas). Quando houver orgao especifico para a modalidade (Receita Federal para MEI/Simples, CGSN, entidades de classe), inclua-o."
      - "5) Em termos simples: explique em linguagem coloquial, em um paragrafo curto, o que esta modalidade significa na pratica para quem trabalha e para quem contrata."
    words: [1500, 2200]
    charts: 2
    must_include: [clt, auditoria-fiscal, mte-fiscalizacao, esocial]
    brief: >
      Modalidades regidas pela CLT e por leis trabalhistas com vinculo
      empregaticio, detalhadas item a item. Gere NO MINIMO 2 blocos
      ```grafico```: um hbar com os
      limites legais de prazo em DIAS (experiencia 90 dias, trabalho
      temporario 180 dias, resposta do trabalhador intermitente em ate
      3 dias) e um grafico sobre a cota de aprendiz (5% a 15% do quadro).
    modalities:
      - "CLT tempo indeterminado (padrao)"
      - "CLT tempo determinado e contrato de experiencia (limites legais)"
      - "Trabalho intermitente (CLT art. 452-A: chamada, ciclos, resposta em 3 dias)"
      - "Trabalho em tempo parcial (CLT art. 58-A)"
      - "Trabalho temporario (Lei 6.019/1974: contratante, tomadora, limites de prazo)"
      - "Teletrabalho/trabalho remoto e hibrido (CLT art. 75-A a 75-F)"
      - "Trabalhador avulso (portuario, Lei 12.545/2011)"
      - "Trabalhador domestico (EC 72/2013 e Lei Complementar 150/2015)"
      - "Trabalhador rural (Lei 5.889/1973)"
      - "Estagio (Lei 11.788/2008)"
      - "Aprendiz (Lei 10.097/2000)"

  - id: modalidades-nao-vinculo
    number: 6
    title: "Modalidades de trabalho sem vínculo empregatício"
    structure:
      - "Faca um subcabecalho (###) para CADA modalidade listada no briefing."
      - "Em cada subcabecalho, use sempre estes cinco pontos, com paragrafos separados:"
      - "1) Como funciona na pratica: quem contrata, como e o contrato, pagamento, obrigacoes do prestador."
      - "2) Como deveria funcionar segundo a lei: base legal exata (lei e artigo), limites, quando deixa de ser legal."
      - "3) Direitos e deveres: crie uma tabela com duas colunas ('Direitos/garantias do prestador' e 'Deveres (prestador e contratante)'), com a base legal de cada item; depois liste em texto os deveres do contratante."
      - "4) Como o Estado enxerga e age: cite obrigatoriamente quem fiscaliza e como apura - MTE/Auditoria-Fiscal do Trabalho (Lei 10.593/2002) para caracterizacao indevida de vinculo (pejotizacao, com nota em CTPS e eSocial), Receita Federal e Comite Gestor do Simples Nacional para MEI/PJ, e as sancoes previstas (multas do Livro V da CLT, responsabilizacao solidaria, exigencia de verbas retroativas)."
      - "5) Em termos simples: explique em linguagem coloquial, em um paragrafo curto, o que esta modalidade significa na pratica para quem presta o servico e para quem contrata."
    words: [1500, 2200]
    charts: 2
    must_include: [clt, codigo-civil, lc123-mei, auditoria-fiscal, ibge-condicoes-vida]
    extra_queries:
      - "informais por sexo idade cor ou raça rendimento conta própria"
      - "subutilização força de trabalho subocupados não ocupados"
      - "saúde mental trabalhadores informais depressão"
      - "Simples Nacional anexos I II III IV lucro presumido alíquotas ME EPP"
      - "lucro real lucro presumido diferenças PJ tributação"
    brief: >
      Modalidades autônomas e empresariais sem vínculo empregatício,
      detalhadas item a item. Use um diagrama comparativo entre trabalho
      autonomo legitimo e vinculo encoberto (pejotizacao): caracteristicas
      de cada um, como o Estado distingue e consequencias do encobrimento.
      TRIBUTACAO DO PJ EM SUBCATEGORIAS (obrigatorio): diferencie ME e EPP
      no Simples Nacional (Anexos I, II, III e IV presentes no contexto,
      faturamento e aliquotas), Simples com excesso de sublimite, lucro
      presumido e lucro real (Lei 9.249/1995 e presuncao de renda para
      servicos), e destaque o MEI como regime simplificado unico com DAS de
      valor fechado. Cite limites, aliquotas e prazos exatamente como
      aparecem no contexto.
      TRABALHO INFORMAL DETALHADO (obrigatorio): classifique as categorias de
      informais presentes no contexto (conta propria nao registrada,
      empregadores ou domesticos sem registro, ajuda familiar, bicos), e para
      cada uma traga os cortes disponiveis: sexo, idade ou faixa etaria, cor
      ou raca, escolaridade e rendimento. Diferencie tambem a forca de
      trabalho subutilizada (desocupados, subocupados por horas e forca de
      trabalho potencial, definicao do IBGE presente no contexto) das pessoas
      fora da forca de trabalho. Distinga
      explicitamente CONTA PROPRIA informal de MEI (o MEI e formalizado, com
      CNAE e DAS) e explique por que o informal recorre menos a planos de
      saude e a cuidados de saude mental; quando as fontes trouxerem
      indicadores ou escalas psicometricas de saude mental (ex.: depressao),
      inclua-os neste topico com a citacao da fonte.
    modalities:
      - "Trabalhador autônomo (pessoa fisica, contrato de prestacao de servico, CC art. 593 e ss. e CLT art. 603)"
      - "PJ (ME, EPP, Simples Nacional, Lucro Presumido e Lucro Real; diferencas, obrigatoriedades, nota fiscal, contabilidade)"
      - "MEI (LC 123/2006: limite de faturamento, atividades permitidas e proibidas, DAS, limite de 1 empregado, beneficios)"
      - "Cooperado (Lei 12.690/2012, cooperativas de trabalho, quando configura fraude)"
      - "Contribuinte individual previdenciario (Lei 8.212/1991)"
      - "Trabalho voluntario (Lei 9.608/1998)"
      - "Trabalho informal (sem qualquer formalizacao; bicos, ajuda familiar e conta propria sem contribuicao)"
      - "Servico via aplicativos/plataformas (referencia breve, detalhado na secao de plataformas)"

  - id: pj-vs-clt
    number: 7
    title: "PJ versus CLT: comparação objetiva"
    charts: 3
    must_include: [clt, lc123-mei, lc-214-2025, ec-132-2023, ibge-pnad, ipea-carta-mercado]
    extra_queries:
      - "rendimento médio com carteira assinada sem carteira PNAD"
      - "rendimento médio trabalhadores formais informais IBGE"
      - "Ipea rendimento formal informal comparativo"
      - "jornada semanal média horas trabalhadores com carteira sem carteira"
      - "salário hora trabalhador formal informal Brasil"
    brief: >
      Tabela e explicacao comparando: custo para a empresa, direitos do
      trabalhador (FGTS, ferias, 13o, INSS, aviso previo, horas extras),
      carga tributaria, risco trabalhista, quando e legal atuar como PJ,
      quando configura fraude (pejotizacao). Simulacao conceitual de custo
      empresa CLT vs PJ com base nas cargas legais citadas no contexto.
      Impacto da reforma tributaria (EC 132/2023 e LC 214/2025) no
      regime de PJ e MEI a partir de 2026-2033 (cronograma de transicao).
      Use graficos comparativos (barras/donut) para direitos e carga.
      COMPARATIVO DE RENDIMENTO E JORNADA (obrigatorio, com fontes IBGE/Ipea):
      faca ao menos um grafico comparando o rendimento medio mensal e a
      jornada semanal media de trabalhadores COM vinculo empregaticio
      (com carteira assinada/CLT) versus SEM vinculo (sem carteira, conta
      propria, informais), citando os numeros exatos do contexto (PNAD/Ipea).
      Esse grafico deve ser o CONTRASTE COM x SEM carteira - NAO crie aqui a
      serie total do rendimento medio mensal (2012-2026), que ja foi
      graficada na secao 1.
      Inclua uma analise detalhada explicando por que a diferenca existe
      (direitos, estabilidade, encargos, informalidade) e o que ela significa
      na pratica para quem escolhe entre os regimes.
      Inclua tambem um grafico de barras com o crescimento real da renda no
      T1 2026 por categoria (conta propria +6%, sem carteira +9,9%, privados
      com carteira +2,8%, se presentes no contexto Ipea) e um grafico com a
      expansao de ocupados em 12 meses (formal +3,6% vs informal +1,5%).
      COMPOSICAO DE 'SEM CARTEIRA' (obrigatorio): explique que ser 'sem
      carteira' NAO e a mesma coisa que 'conta propria' nem que MEI: dentro
      da categoria sem carteira ha trabalhadores por conta propria informais,
      MEIs (que tem DAS mas nao carteira assinada) e empregados sem registro,
      alem de trabalhadores em ocupacoes typicas da informalidade. Use os
      dados do contexto (cortes por categoria, sexo, idade, cor ou raca e
      rendimento quando disponiveis) em um grafico ou tabela que detalhe essa
      composicao, e explique por que a confusao entre os termos distorce a
      leitura dos numeros de informalidade.
      Feche com um diagrama comparativo 'CLT x PJ' cobrando direitos,
      custo para a empresa e risco trabalhista.

  - id: mei-e-informal
    number: 8
    title: "MEI e trabalho informal"
    charts: 2
    must_include: [lc123-mei, inss-8212, lc-214-2025, mei-das-2026-receita, senado-mei-plp186]
    brief: >
      O que e o MEI, limites de faturamento, atividades permitidas, DAS,
      beneficios (auxilio-doenca, aposentadoria, pensao - Lei 8.213/1991),
      obrigatoriedade de empregado, como funciona a formalizacao. Vantagens
      e riscos. Trabalho informal: caracteristicas, quem e o trabalhador
      informal, riscos (ausencia de INSS, FGTS, sindicalizacao), como se
      proteger, programas de formalizacao (Mei+Prev, Seguro Defeso).
      Cite o valor do DAS do MEI em 2026 (fonte da Receita Federal) e a
      proposta em tramitacao no Senado que eleva o teto de faturamento e
      perdoa dividas do MEI. TRIBUTACAO E VANTAGENS EM DETALHE (obrigatorio):
      explique os limites e a composicao do DAS e do Simples presentes no
      contexto (teto de faturamento do MEI e do ME/EPP, aliquotas dos Anexos
      do Simples, INSS embutido, ISS e ICMS) e detalhe POR QUE muitos
      trabalhadores preferem o MEI a assinar carteira ou abrir uma PJ comum
      (custo mensal fixo e baixo, pouca burocracia, emissao de nota pelo
      portal, autonomia de horario) e o que perdem ao abrir mao do vinculo
      (FGTS, aviso previo, horas extras, adicional noturno, multa
      rescisoria, estabilidade). Use graficos para comparar MEI x informal x CLT
      e o cronograma da reforma tributaria. Use tambem um diagrama
      comparativo 'MEI formalizado x trabalho informal' (direitos,
      contribuicao previdenciaria e riscos de cada um). Se graficar a
      evolucao do teto de faturamento do MEI, use TODOS os pontos do contexto
      no eixo X (minimo 4): patamar de R$ 81.000 de 2016 ate 2026,
      R$ 110.000 em 2027 e R$ 140.000 em 2028 (PLP 186/2026 aprovado no
      Senado) - se nao houver pontos suficientes, apresente em tabela
      Markdown, nunca grafico de linha com menos de 4 pontos.

  - id: previdencia-tributos
    number: 9
    title: "Previdência e tributos do trabalhador"
    charts: 2
    must_include: [inss-8212, inss-8213, ec-103-2019, lc-214-2025, ec-132-2023]
    brief: >
      Como funciona o INSS para CLT (contribuicao patronal e do trabalhador,
      Lei 8.212/1991), para MEI (DAS com INSS embutido), para autônomo e PJ
      (carnê ou nota fiscal), e para informal (contribuicao opcional).
      Tabela de aliquotas e faixas com os valores presentes no contexto.
      Reforma da previdencia (EC 103/2019): regras de transicao aplicaveis
      ao trabalhador. Reforma tributaria (EC 132/2023 e LC 214/2025): IBS,
      CBS, cronograma de transicao 2026-2033, impacto no MEI e no Simples
       Nacional. Use graficos de barras (aliquotas) e de linha/colunas
       (cronograma de transicao). SE o contexto trazer a serie historica de
       meses de carencia do INSS (1991-2026), faca um grafico de linha com
       TODOS os anos da serie e explique que o patamar de 180 meses vale
       desde 2012.

  - id: plataformas
    number: 10
    title: "Trabalho por plataformas digitais"
    charts: 1
    must_include: [clt, auditoria-fiscal, ibge-plataformas-perfil, ibge-audio-app-2026]
    extra_queries:
      - "perfil trabalhadores por aplicativo sexo idade escolaridade cor ou raça"
      - "motoristas entregadores aplicativo rendimento renda conta própria"
    brief: >
      Como funciona (apps de entrega, transporte, servicos). Numero de
      trabalhadores por aplicativo no Brasil (cite os dados do IBGE e da
      imprensa coletados). PERFIL DOS TRABALHADORES POR APLICATIVO
      (obrigatorio): traga os cortes presentes no contexto - sexo, idade ou
      faixa etaria, cor ou raca, escolaridade e rendimento - e detalhe os
      tipos de trabalho por plataforma (entrega de alimentos, transporte de
      passageiros, servicos gerais e outros citados nas fontes). Explique
      como se distribui a participacao de homens e mulheres entre as
      atividades quando os dados estiverem no contexto, e diferencie quem
      atua formalizado como MEI de quem atua como conta propria informal.
      Situacao juridica em 2026: proposicoes em
      tramitacao (PL 12/2024 e demais PLs do contexto), Convencao 193 da OIT
      (se houver referencia no contexto), medidas do MTE (transparencia de
      valores, pontos de apoio, comite interministerial). Direitos em
      discussao (contribuicao previdenciaria, limites de taxa de cobranca,
      remuneracao minima). Quem e prejudicado e quem se beneficia com cada
      proposta. Use um grafico de barras (volume de trabalhadores) e uma
      tabela Markdown com as etapas do ciclo de trabalho no aplicativo.
      Escreva os volumes de trabalhadores
      formatados em portugues (ex.: '1,2 milhao de trabalhadores', cerca de
      1,2% dos ocupados); NAO use numeros crus.

  - id: tramitacao-2026
    number: 11
    title: "Mudanças em tramitação no Congresso em 2026"
    charts: 0
    words: [950, 1350]
    must_include: [camara-proposicoes, senado-materias, noticias-trabalho, stf-pejotizacao-2026, stf-pauta-outubro-2026, camara-proposicoes-flex, noticias-flexibilizacao]
    extra_queries:
      - "fim da escala 6x1 como vai funcionar"
      - "PEC 6x1 escala jornada Senado aprovação"
      - "jornada 40 horas semanais projeto de lei"
      - "redução 44 horas para 40 horas trabalho"
      - "STF pejotização suspensão processos TRTs"
      - "STF pauta outubro 2026 aplicativo fretamento"
      - "flexibilização trabalhista projeto de lei Congresso 2026"
      - "STF anotação CTPS autônomo intermitente ficha azul"
      - "Convenção 193 OIT plataformas digitais ratificação Brasil"
      - "TST decisão jurisprudência trabalhista 2026"
      - "Estatuto do Autônomo projeto de lei"
      - "reforma trabalhista 2.0 propostas Congresso"
    brief: >
      Coleta atual de proposicoes (Camara e Senado) sobre trabalho:
      reforma trabalhista, plataformas digitais, pejotizacao, MEI,
      tributacao. Para cada proposicao: ementa, situacao, quem apoia,
      quem e prejudicado. Identificar tambem medidas do Executivo
      (portarias do MTE, decretos) quando presentes no contexto.
       Use uma tabela Markdown com as principais proposicoes e uma tabela
       com as etapas da tramitacao da PEC do fim da escala 6x1, intitulada
       'Tramitacao da PEC do Fim da Escala 6x1'.
       OBRIATORIO: dedique um subtopico explicito ao cenario POS-APROVACAO
      NO SENADO de (a) FIM DA ESCALA 6x1 e (b) REDUCAO DA JORNADA DE
      44 HORAS SEMANAIS PARA 40 HORAS: explique COMO VAI FUNCIONAR a
      jornada, os intervalos e a compensacao de dias, a vigencia/prazo de
      entrada em vigor, a proporcionalidade salarial, quem passa a ter
      direito e o que muda na pratica para trabalhador e empregador,
      citando sempre as fontes do contexto (proposicoes, imprensa).
      OBRIATORIO TAMBEM: dedique um subtopico ao STF em 2026, cobrindo (a) a
      retirada da suspensao de processos sobre pejotizacao na 1a instancia e
      nos TRTs - o que isso muda na pratica para denuncias, acoes
      trabalhistas e para empresas que usam PJ; e (b) os destaques da pauta
      do Plenario em outubro de 2026 que envolvem trabalho por aplicativo
       (fretamento de onibus por aplicativo) - o que esta em jogo, quem e
       afetado e qual o desfecho ou andamento indicado nas fontes.
       FLEXIBILIZACAO DO TRABALHO NO LEGISLATIVO E NO JUDICIARIO
       (obrigatorio): dedique um subtopico explicito as medicoes e
       discussoes sobre flexibilizacao das regras trabalhistas em 2026,
       separando os DOIS CAMPOS:
       (a) LEGISLATIVO: classifique as proposicoes do contexto (Camara,
       Senado, fontes camara-proposicoes, camara-proposicoes-flex,
       senado-materias e imprensa) em dois eixos - medicoes de
       FLEXIBILIZACAO (ex.: propostas que autorizam ou ampliam o trabalho
       como PJ/pejotizacao, Estatuto do Autonomo, flexibilizacao de
       intervalos, jornada ou encargos, modelos de contratacao por
       aplicativo com menos obrigacoes, o que houver no contexto) e
       medicoes de REFORCO ou REGULACAO (ex.: fim da escala 6x1 e reducao
       para 40 horas, Convencao 193 da OIT sobre plataformas digitais e seu
       PL de ratificacao, PL de plataformas com direitos minimos, o que
       houver no contexto). Para cada proposicao relevante: numero
       (PL/PEC/MP/Conv), ementa resumida, situacao na tramitacao, quem
       apoia e quem e prejudicado.
       (b) JUDICIARIO: cubra o que as fontes do contexto trouxerem de
       decisoes e pautas que AFETAM a flexibilizacao em 2026 - STF (pejotizacao
       e suspensao dos processos nos TRTs; pauta do Plenario sobre aplicativos
       e fretamento) e TST (jurisprudencia sobre trabalho intermitente,
       teletrabalho, banco de horas, pejotizacao, prescricao, greve e
       caracterizacao de vinculo, quando presente no contexto). Explique a
       TENSAO entre o que o Judiciario formaliza ou restringe e o que o
       Legislativo propoe flexibilizar, com consequencias praticas para
       trabalhador e empresa.
       Se o contexto nao trouxer detalhe de algum ponto, use os detalhes
       efetivamente presentes e aprofunde o que ha.

  - id: riscos-e-direitos
    number: 12
    title: "Riscos e como se proteger"
    charts: 1
    must_include: [mte-fiscalizacao, auditoria-fiscal, clt, lei-14457]
    brief: >
      Principais riscos para cada modalidade (trabalhador e empresa):
      saude e seguranca (NRs, EPI - CLT), assedio (Lei 14.457/2022),
      fraude trabalhista. Como comprovar vinculo, como agir em caso de
      desvio, como funciona a fiscalizacao do MTE, papel do sindicato e
      da advocacia trabalhista. Checklist pratico para quem quer migrar
      de CLT para PJ/MEI e vice-versa. Use um diagrama comparativo de
      riscos x protecoes por modalidade.

  - id: quadro-resumo
    number: 13
    title: "Quadro resumo e conclusões"
    charts: 1
    must_include: [clt, lc123-mei]
    brief: >
      Tabela consolidada comparando todas as modalidades em termos de
      direitos, deveres, custo, risco e indicacao de uso. Cenarios futuros
      ate 2030 (reforma tributaria, plataformas, inteligencia artificial no
      trabalho). Conclusoes objetivas: o que esta estabelecido, o que
      pode mudar, quem e mais afetado pelas mudancas. NAO faca graficos de
      recapitulacao de series ja graficadas na secao 1 (taxa de desocupacao,
      informalidade, rendimento medio total) - retome esses numeros em texto
      ou tabela. Se usar graficos, sejam apenas series NOVAS ainda nao
      graficadas (ex.: empregados ou rendimento COM versus SEM carteira,
      salario minimo real). Feche com um comparativo final das modalidades.

appendix:
