    Tabela em linguagem simples com todas as normas citadas no relatorio
    (Constituicao, CLT, leis, leis complementares e emendas): o que cada
    norma regula, para quem protege ou obriga e onde encontrar o texto
    oficial. Nenhuma linha sem base legal.

